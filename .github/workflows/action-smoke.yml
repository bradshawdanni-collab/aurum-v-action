name: Action smoke test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  docker-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Reject tracked compiled Python artifacts
        shell: bash
        run: |
          set -euo pipefail
          bad="$(git ls-files | grep -E '(^|/)(__pycache__/|.*\.py[cod]$|.*\$py\.class$)' || true)"
          if [ -n "$bad" ]; then
            printf '%s\n' "STRUCTURED_DIAGNOSTIC category=TRACKED_PYTHON_COMPILED_ARTIFACTS result=FAIL" "$bad"
            exit 12
          fi
          echo "STRUCTURED_DIAGNOSTIC category=TRACKED_PYTHON_COMPILED_ARTIFACTS result=PASS"

      - name: Build Action image
        run: docker build -t aurum-v-action-test .

      - name: Verify missing authorization fails closed
        shell: bash
        run: |
          set +e
          output="$(docker run --rm aurum-v-action-test 2>&1)"
          code=$?
          set -e
          printf '%s\n' "$output"
          test "$code" -ne 0
          grep -q 'result: INVALID_ARTIFACT' <<<"$output"
          grep -q 'denial-code: APPROVAL_BUNDLE_REQUIRED' <<<"$output"
